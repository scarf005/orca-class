name: Publish itch.io

on: {push: {tags: ['v*', '[0-9]*']}}

permissions: {contents: read}
concurrency: {group: itch-publish, cancel-in-progress: false}

jobs:
  check-version:
    runs-on: ubuntu-24.04
    outputs: {valid: '${{ steps.semver.outputs.valid }}'}
    steps:
      - name: Validate SemVer tag
        id: semver
        env: {TAG: '${{ github.ref_name }}'}
        shell: bash
        run: |
          semver='^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ "$TAG" =~ $semver ]]; then
            echo 'valid=true' >> "$GITHUB_OUTPUT"
          fi
  publish:
    needs: check-version
    if: needs.check-version.outputs.valid == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check itch.io credentials
        env: {BUTLER_API_KEY: "${{ secrets.BUTLER_API_KEY }}"}
        run: test -n "$BUTLER_API_KEY"
      - uses: chickensoft-games/setup-godot@v2
        with: {version: 4.7.2, use-dotnet: false, include-templates: true}
      - uses: extractions/setup-just@v3
      - name: Install butler
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/butler.zip" https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          mkdir -p "$RUNNER_TEMP/butler"
          unzip -q "$RUNNER_TEMP/butler.zip" -d "$RUNNER_TEMP/butler"
          echo "$RUNNER_TEMP/butler" >> "$GITHUB_PATH"
      - name: Export, validate, and publish
        env: {BUTLER_API_KEY: "${{ secrets.BUTLER_API_KEY }}"}
        run: just upload "$GITHUB_SHA"
